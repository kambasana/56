# Blastradius "likely next compromise" model: one-off bootstrap (docs/DATA-ML.md §2.4–2.7).
#
# Copy into the PRIVATE repo (kambasana/blastradius-hammer) as .github/workflows/train.yml.
# Not wired up: run it by hand (workflow_dispatch). It
#   1. labels compromised releases (pack/model/labels.py: OSV MAL-*/CWE-506, supplychain-attack-data,
#      incident KB) and fetches packuments for them and the committed negative package lists
#      (pack/model/manifest: dependency walk from the Acme lockfiles, hammer control repos),
#   2. builds the dataset with the shared TS feature module (src/features/cli.ts) and as-of
#      download history (api.npmjs.org),
#   3. trains LightGBM + isotonic calibration and checks TS/LightGBM parity to 1e-6,
#   4. runs the backtest gate against the hand-weighted noisy-OR,
#   5. publishes the model as a release asset ONLY when the gate passes (tag model-<date>).
# The job summary always carries the metrics and the gate report, pass or fail.
name: train

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Blastradius branch, tag or commit in kambasana/56
        default: data-ml/model
        required: true
      cutoff:
        description: Time split; releases before this train, the rest test
        default: '2026-01-01T00:00:00Z'
        required: true

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: src/blastradius
    steps:
      - name: Check out Blastradius (public)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kambasana/56
          ref: ${{ inputs.ref }}
          path: src
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install
        run: |
          npm ci --ignore-scripts
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -r pack/model/requirements.txt

      - name: Labels (OSV npm export, supplychain-attack-data, incident KB)
        run: |
          mkdir -p "$RUNNER_TEMP/osv"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/osv/npm-all.zip" https://osv-vulnerabilities.storage.googleapis.com/npm/all.zip
          git clone -q https://github.com/tstromberg/supplychain-attack-data "$RUNNER_TEMP/sad"
          C="$RUNNER_TEMP/packuments"; L="$RUNNER_TEMP/labels"
          "$RUNNER_TEMP/venv/bin/python" pack/model/labels.py names --osv-zip "$RUNNER_TEMP/osv/npm-all.zip" --attack-data "$RUNNER_TEMP/sad" --root . --out "$L"
          cat "$L/candidates.txt" pack/model/manifest/universe-negatives.txt pack/model/manifest/universe-hammer.txt > "$RUNNER_TEMP/fetch.txt"
          python3 pack/model/fetch_packuments.py --names "$RUNNER_TEMP/fetch.txt" --cache "$C"
          "$RUNNER_TEMP/venv/bin/python" pack/model/labels.py labels --osv-zip "$RUNNER_TEMP/osv/npm-all.zip" --attack-data "$RUNNER_TEMP/sad" --root . --cache "$C" --out "$L"

      - name: Build dataset (shared TS feature module, as-of downloads)
        env:
          CUTOFF: ${{ inputs.cutoff }}
        run: |
          M=pack/model/manifest
          args=(--root . --cache "$RUNNER_TEMP/packuments" --labels "$RUNNER_TEMP/labels" --negatives $M/universe-negatives.txt \
            --negatives $M/universe-hammer.txt --controls $M/universe-controls.txt --out "$RUNNER_TEMP/dataset" --cutoff "$CUTOFF")
          python3 pack/model/build_dataset.py "${args[@]}" --requests-only
          python3 pack/model/fetch_downloads.py --requests "$RUNNER_TEMP/dataset/requests.jsonl" --out "$RUNNER_TEMP/downloads"
          python3 pack/model/build_dataset.py "${args[@]}" --downloads "$RUNNER_TEMP/downloads"

      - name: Train, calibrate, parity check
        run: |
          "$RUNNER_TEMP/venv/bin/python" pack/model/train.py --root . --dataset "$RUNNER_TEMP/dataset" --out "$RUNNER_TEMP/model"

      - name: Backtest gate
        id: gate
        run: |
          set +e
          npm run -s model:gate -- --bundle "$RUNNER_TEMP/model/model.json" --cache "$RUNNER_TEMP/packuments" --out "$RUNNER_TEMP/gate"
          code=$?
          echo "pass=$([ "$code" = 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          {
            echo "## Dataset"; echo '```json'; cat "$RUNNER_TEMP/dataset/report.json" | head -c 20000; echo '```'
            echo "## Training metrics"; echo '```json'; cat "$RUNNER_TEMP/model/metrics.json" | head -c 20000; echo '```'
            cat "$RUNNER_TEMP/gate/gate.md"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$code" = 0 ] || [ "$code" = 3 ]

      - name: Publish model (gate passed only)
        if: steps.gate.outputs.pass == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="model-$(date -u +%Y%m%d-%H%M)"
          sha256sum "$RUNNER_TEMP/model/model.json" | cut -d' ' -f1 > "$RUNNER_TEMP/model/model.json.sha256"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "Model $tag" --notes-file "$RUNNER_TEMP/gate/gate.md" \
            "$RUNNER_TEMP/model/model.json" "$RUNNER_TEMP/model/model.json.sha256" "$RUNNER_TEMP/model/metrics.json" "$RUNNER_TEMP/gate/gate.json"
