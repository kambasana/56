# Blastradius "likely next compromise" model: one-off bootstrap (docs/DATA-ML.md §2.4–2.7).
#
# Copy into the PRIVATE repo (kambasana/blastradius-hammer) as .github/workflows/train.yml.
# Not wired up: run it by hand (workflow_dispatch). It
#   1. fetches npm packuments for the package universe (Acme org lockfiles = noise set, incident
#      packages, and training negatives found by walking dependencies out from the controls),
#   2. builds the dataset with the shared TS feature module (src/features/cli.ts),
#   3. trains LightGBM + isotonic calibration and checks TS/LightGBM parity to 1e-6,
#   4. runs the backtest gate against the hand-weighted noisy-OR,
#   5. publishes the model as a release asset ONLY when the gate passes (tag model-<date>).
# The job summary always carries the metrics and the gate report, pass or fail.
name: train

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Blastradius branch, tag or commit in kambasana/56
        default: data-ml/model
        required: true
      cutoff:
        description: Time split; releases before this train, the rest test
        default: '2023-01-01T00:00:00Z'
        required: true
      rounds:
        description: Dependency-walk rounds for training negatives
        default: '8'
        required: true

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: src/blastradius
    steps:
      - name: Check out Blastradius (public)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kambasana/56
          ref: ${{ inputs.ref }}
          path: src
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install
        run: |
          npm ci --ignore-scripts
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -r pack/model/requirements.txt

      - name: Known-bad releases (OSV npm export)
        run: |
          mkdir -p "$RUNNER_TEMP/osv"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/osv/npm-all.zip" https://storage.googleapis.com/osv-vulnerabilities/npm/all.zip
          unzip -q "$RUNNER_TEMP/osv/npm-all.zip" 'MAL-*' 'GHSA-*' -d "$RUNNER_TEMP/osv/recs"
          python3 pack/model/known_bad.py --osv-dir "$RUNNER_TEMP/osv/recs" --out "$RUNNER_TEMP/known-bad.json"

      - name: Fetch packuments (registry.npmjs.org)
        env:
          ROUNDS: ${{ inputs.rounds }}
        run: |
          C="$RUNNER_TEMP/packuments"; U="$RUNNER_TEMP/universe"
          python3 pack/model/universe.py --replay test/replay --cache "$C" --out "$U" --max-negatives 20000
          cat "$U/incidents.txt" "$U/controls.txt" > "$U/first.txt"
          python3 pack/model/fetch_packuments.py --names "$U/first.txt" --cache "$C"
          for i in $(seq 1 "$ROUNDS"); do
            python3 pack/model/universe.py --replay test/replay --cache "$C" --out "$U" --max-negatives 20000
            python3 pack/model/fetch_packuments.py --names "$U/negatives.txt" --cache "$C"
          done
          python3 pack/model/universe.py --replay test/replay --cache "$C" --out "$U" --max-negatives 20000

      - name: Build dataset (shared TS feature module)
        env:
          CUTOFF: ${{ inputs.cutoff }}
        run: |
          python3 pack/model/build_dataset.py --root . --cache "$RUNNER_TEMP/packuments" --universe "$RUNNER_TEMP/universe" \
            --out "$RUNNER_TEMP/dataset" --cutoff "$CUTOFF" --known-bad "$RUNNER_TEMP/known-bad.json"

      - name: Train, calibrate, parity check
        run: |
          "$RUNNER_TEMP/venv/bin/python" pack/model/train.py --root . --dataset "$RUNNER_TEMP/dataset" --out "$RUNNER_TEMP/model"

      - name: Backtest gate
        id: gate
        run: |
          set +e
          npm run -s model:gate -- --bundle "$RUNNER_TEMP/model/model.json" --cache "$RUNNER_TEMP/packuments" --out "$RUNNER_TEMP/gate"
          code=$?
          echo "pass=$([ "$code" = 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          {
            echo "## Dataset"; echo '```json'; cat "$RUNNER_TEMP/dataset/report.json" | head -c 20000; echo '```'
            echo "## Training metrics"; echo '```json'; cat "$RUNNER_TEMP/model/metrics.json" | head -c 20000; echo '```'
            cat "$RUNNER_TEMP/gate/gate.md"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$code" = 0 ] || [ "$code" = 3 ]

      - name: Publish model (gate passed only)
        if: steps.gate.outputs.pass == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="model-$(date -u +%Y%m%d-%H%M)"
          sha256sum "$RUNNER_TEMP/model/model.json" | cut -d' ' -f1 > "$RUNNER_TEMP/model/model.json.sha256"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "Model $tag" --notes-file "$RUNNER_TEMP/gate/gate.md" \
            "$RUNNER_TEMP/model/model.json" "$RUNNER_TEMP/model/model.json.sha256" "$RUNNER_TEMP/model/metrics.json" "$RUNNER_TEMP/gate/gate.json"
